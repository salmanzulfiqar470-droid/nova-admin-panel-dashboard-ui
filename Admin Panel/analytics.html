<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Analytics - Vector Admin</title>

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- CHART JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    />

</head>

<body>

    <div class="wrapper">

        <!-- SIDEBAR -->

        <aside class="sidebar" id="sidebar">
<div class="logo-area">

                <div class="logo-text">
                    <h4>Vector Admin</h4>
                </div>

                 <button class="collapse-btn d-none d-lg-flex" id="collapseBtn">
            <i class="bi bi-list"></i>
        </button>

            </div>

            <ul class="menu">

    <li>
        <a href="index.html">
            <i class="bi bi-grid"></i>
            <span>Dashboard</span>
        </a>
    </li>

    <li>
        <a href="analytics.html">
            <i class="bi bi-bar-chart-line"></i>
            <span>Analytics</span>
        </a>
    </li>

    <li>
        <a href="users.html">
            <i class="bi bi-people"></i>
            <span>Users</span>
        </a>
    </li>

    <li>
        <a href="products.html">
            <i class="bi bi-box"></i>
            <span>Products</span>
        </a>
    </li>

    <li>
        <a href="kanban.html">
            <i class="bi bi-kanban"></i>
            <span>Kanban</span>
        </a>
    </li>

    <li>
        <a href="calendar.html">
            <i class="bi bi-calendar-event"></i>
            <span>Calendar</span>
        </a>
    </li>

    <li>
        <a href="chat.html">
            <i class="bi bi-chat-dots"></i>
            <span>Chat</span>
        </a>
    </li>

    <li>
        <a href="files.html">
            <i class="bi bi-folder2-open"></i>
            <span>Files</span>
        </a>
    </li>

    <li>
        <a href="settings.html">
            <i class="bi bi-gear"></i>
            <span>Settings</span>
        </a>
    </li>

</ul>

        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- MAIN -->

        <main class="main">

            <!-- NAVBAR -->

            <nav class="top-navbar">

                <div class="nav-left">

                    <button class="menu-btn" id="menuBtn">
                        <i class="bi bi-list"></i>
                    </button>

                    <h5 class="mb-0">
                        Analytics Dashboard
                    </h5>

                </div>

            </nav>

            <!-- CONTENT -->

            <div class="content container-fluid">

                <!-- STATS -->

                <div class="row g-4 mb-4">

                    <div class="col-xl-3 col-md-6">

                        <div class="dashboard-card card-style-1">

                            <div>

                                <p>Total Revenue</p>

                                <h3>$42,580</h3>

                            </div>

                            <div class="icon-box">
                                <i class="bi bi-currency-dollar"></i>
                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="dashboard-card card-style-2">

                            <div>

                                <p>Total Orders</p>

                                <h3>8,420</h3>

                            </div>

                            <div class="icon-box">
                                <i class="bi bi-cart-check"></i>
                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="dashboard-card card-style-3">

                            <div>

                                <p>New Users</p>

                                <h3>1,240</h3>

                            </div>

                            <div class="icon-box">
                                <i class="bi bi-people"></i>
                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="dashboard-card card-style-4">

                            <div>

                                <p>Growth Rate</p>

                                <h3>28%</h3>

                            </div>

                            <div class="icon-box">
                                <i class="bi bi-graph-up-arrow"></i>
                            </div>

                        </div>

                    </div>

                </div>

                <!-- CHARTS -->

                <div class="row g-4">

                    <!-- LINE CHART -->

                    <div class="col-lg-8">

                        <div class="custom-card">

                            <div class="d-flex justify-content-between mb-4">

                                <h5>
                                    Revenue Overview
                                </h5>

                                <select class="form-select w-auto">

                                    <option>
                                        This Year
                                    </option>

                                    <option>
                                        Last Year
                                    </option>

                                </select>

                            </div>

                            <canvas id="revenueChart"></canvas>

                        </div>

                    </div>

                    <!-- PIE -->

                    <div class="col-lg-4">

                        <div class="custom-card">

                            <h5 class="mb-4">
                                Traffic Sources
                            </h5>

                            <canvas id="trafficChart"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <footer class="admin-footer">

    <p>
        © 2026 Nexus Admin Dashboard
    </p>

</footer>

        </main>

    </div>

    <!-- JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CHARTS -->

    <script>

        // LINE CHART

        const revenueChart = document.getElementById('revenueChart');

        new Chart(revenueChart, {

            type: 'line',

            data: {

                labels: [
                    'Jan',
                    'Feb',
                    'Mar',
                    'Apr',
                    'May',
                    'Jun',
                    'Jul'
                ],

                datasets: [{

                    label: 'Revenue',

                    data: [
                        1200,
                        1900,
                        3000,
                        2500,
                        4200,
                        5000,
                        6200
                    ],

                    borderColor: '#4f46e5',

                    backgroundColor: 'rgba(79,70,229,0.2)',

                    tension: 0.4,

                    fill: true

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {
                        display: false
                    }

                }

            }

        });

        // PIE CHART

        const trafficChart = document.getElementById('trafficChart');

        new Chart(trafficChart, {

            type: 'doughnut',

            data: {

                labels: [
                    'Direct',
                    'Social',
                    'Ads',
                    'Referral'
                ],

                datasets: [{

                    data: [
                        35,
                        25,
                        20,
                        20
                    ],

                    backgroundColor: [
                        '#4f46e5',
                        '#7c3aed',
                        '#06b6d4',
                        '#22c55e'
                    ]

                }]

            },

            options: {

                responsive: true

            }

        });

    </script>

    <script src="js/script.js"></script>

</body>
</html>
